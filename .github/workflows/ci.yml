name: CI - Lint & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: docker/Dockerfile
          ignore: DL3008

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.x'

      - name: Install and run pip-audit
        run: |
          python -m pip install pip-audit
          pip-audit -r docker/requirements.txt

      - name: Syntax-check fetcher.py
        run: python -m py_compile docker/fetcher.py

      - name: Build image (single-arch, load)
        run: |
          docker buildx build --load -f docker/Dockerfile -t ia-mirror:${{ github.sha }} docker

      - name: Create SBOM (syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ia-mirror:${{ github.sha }}
          output-file: sbom.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error
